<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        #count {
            font-size: 60px;
            margin: 20px;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>JavaScript Counter</h1>

    <div id="count">0</div>

    <button onclick="decrease()">-</button>
    <button onclick="reset()">Reset</button>
    <button onclick="increase()">+</button>


    <script>
        // Store the current count
        let count = 0;

        // Increase count
        function increase() {
            count++;
            document.getElementById("count").innerText = count;
        }

        // Decrease count
        function decrease() {

            if(count>0){
                
                count--;
            }
            document.getElementById("count").innerText = count;
        }

        // Reset count
        function reset() {
            count = 0;
            document.getElementById("count").innerText = count;
        }
    </script>

</body>
</html>
