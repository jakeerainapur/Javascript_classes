<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Webpage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        textarea {
            width: 400px;
            height: 120px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #007bff;
        }
    </style>
</head>

<body>

    <h1>It's a Webpage</h1>

    <label for="tarea">Type Anything:</label>

    <textarea id="tarea" placeholder="Type something here..."></textarea>

    <script src="script.js"></script>

</body>
</html>
