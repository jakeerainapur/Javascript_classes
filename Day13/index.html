```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM Selectors</title>
</head>

<body>

    <h1 id="title">DOM Selectors</h1>

    <p class="text">First Paragraph</p>
    <p class="text">Second Paragraph</p>
    <p class="text">Third Paragraph</p>

    <div class="box">Box 1</div>
    <div class="box">Box 2</div>

    <button id="myButton">Click Me</button>

    <ul id="list">
        <li>Java</li>
        <li>JavaScript</li>
        <li>HTML</li>
        <li>CSS</li>
    </ul>


    <script>
// 1. getElementById()
        const title = document.getElementById("title");

        console.log("1. getElementById:", title);
        
//2. getElementsByClassName()
        const texts = document.getElementsByClassName("text");

        console.log("2. getElementsByClassName:", texts);

        console.log(texts[0]);
        console.log(texts[1]);
        console.log(texts[2]);
// querySelector()
        const paragraphs = document.getElementsByTagName("p");

        console.log("3. getElementsByTagName:", paragraphs);


        
        // 4. querySelector()
       
        const firstText = document.querySelector(".text");

        console.log("4. querySelector:", firstText);


        
        // 5. querySelectorAll()
       // Selects ALL matching elements

        const allTexts = document.querySelectorAll(".text");

        console.log("5. querySelectorAll:", allTexts);

        // 6. querySelector() - ID
         const heading = document.querySelector("#title");

        console.log("6. ID selector:", heading);

// 7. querySelector() - CLASS
        const box = document.querySelector(".box");

        console.log("7. Class selector:", box);


        // ==========================================
        // 8. querySelector() - TAG
        // ==========================================

        const paragraph = document.querySelector("p");

        console.log("8. Tag selector:", paragraph);

        //9. querySelectorAll() - CLASS
        const boxes = document.querySelectorAll(".box");
     console.log("9. All boxes:", boxes);

// 10. querySelectorAll() - TAG
        const listItems = document.querySelectorAll("li");

        console.log("10. All list items:", listItems);

    </script>

</body>
</html>
```
